<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>XShala – 3D Printing & CAD Training</title>
  <style>
    /* ===================================
        Base Styling & Variables
        ===================================
    */
    :root {
        /* Color Palette - Day & Night */
        --primary-bg: #0a0a0a;
        --secondary-bg: #1a1a2e;
        --text-primary: #ffffff;
        --text-secondary: #cccccc;
        --accent-cyan: #00ffff;
        --accent-magenta: #ff00ff;
        --accent-green: #00ff00;
        --card-bg: rgba(0, 0, 0, 0.7);
        --card-border-cyan: rgba(0, 255, 255, 0.3);
        --card-border-magenta: rgba(255, 0, 255, 0.3);
        --card-border-green: rgba(0, 255, 0, 0.3);
        --logo-text-shadow: 0 0 20px var(--accent-cyan);
        --logo-accent-color: var(--accent-cyan);
        --header-bg: rgba(10, 10, 10, 0.95);
        --header-border: 2px solid var(--accent-cyan);
        --footer-bg: rgba(0, 0, 0, 0.95);
        --btn-primary-start: #00ffff;
        --btn-primary-end: #0080ff;
    }

    /* Day Theme */
    :root.theme-day {
        --primary-bg: #f0f2f5;
        --secondary-bg: #e2e4e8;
        --text-primary: #1a1a1a;
        --text-secondary: #555555;
        --accent-cyan: #0080ff;
        --accent-magenta: #ff6600;
        --accent-green: #008800;
        --card-bg: rgba(255, 255, 255, 0.8);
        --card-border-cyan: rgba(0, 128, 255, 0.3);
        --card-border-magenta: rgba(255, 102, 0, 0.3);
        --card-border-green: rgba(0, 136, 0, 0.3);
        --logo-text-shadow: none;
        --logo-accent-color: var(--text-primary);
        --header-bg: rgba(255, 255, 255, 0.95);
        --header-border: 2px solid var(--accent-cyan);
        --footer-bg: rgba(255, 255, 255, 0.95);
        --btn-primary-start: #0080ff;
        --btn-primary-end: #0055aa;
    }

    /* ===================================
        Global & Utility
        ===================================
    */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--primary-bg);
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    section {
      padding: 80px 0;
      position: relative;
      z-index: 2;
    }

    h1, h2, h3 {
      font-weight: 600;
      color: var(--text-primary);
    }

    p {
        line-height: 1.6;
        color: var(--text-secondary);
        opacity: 0.9;
    }
    ul.list-style-none {
        list-style: none;
        padding-left: 0;
    }

    ul.list-style-none li {
        margin-bottom: 0.5rem;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 1.2rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--btn-primary-start), var(--btn-primary-end));
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 255, 255, 0.4);
    }
    
    .theme-day .btn-primary:hover {
        box-shadow: 0 15px 35px rgba(0, 128, 255, 0.4);
    }

    .mode-toggle-btn, .language-btn {
        background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
        color: #000;
        border: none;
        padding: 0.4rem 0.8rem;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .mode-toggle-btn {
        font-size: 1.2rem;
        padding: 0.4rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--text-primary);
        box-shadow: none;
    }

    .mode-toggle-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }

    .language-btn.active {
        background: linear-gradient(45deg, var(--accent-magenta), var(--accent-green));
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
    }
    
    .theme-day .language-btn.active {
        background: linear-gradient(45deg, var(--accent-magenta), var(--accent-green));
    }


    /* ===================================
        Header & Navigation
        ===================================
    */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 15px 0;
      border-bottom: 2px solid var(--header-border);
      transition: background-color 0.5s ease, border-bottom 0.5s ease;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      text-shadow: var(--logo-text-shadow);
    }

    .logo span {
      color: var(--logo-accent-color);
      animation: neonPulse 2s ease-in-out infinite alternate;
    }
    
    .theme-day .logo span {
        animation: none;
    }

    @keyframes neonPulse {
        0% { text-shadow: 0 0 20px var(--accent-cyan); }
        100% { text-shadow: 0 0 30px var(--accent-cyan), 0 0 40px var(--accent-cyan); }
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
      padding: 0.5rem 1rem;
      border-radius: 5px;
    }

    .nav-links a:hover {
      color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .language-selector {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    /* ===================================
        Animated Background & Effects
        ===================================
    */
    .animated-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    .theme-day .animated-background {
        background: linear-gradient(135deg, #f0f2f5 0%, #e2e4e8 25%, #d1d4d8 50%, #c1c4c8 75%, #b1b4b8 100%);
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    /* Floating Elements */
      /* Enhanced Floating STEM Elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            color: rgba(0, 255, 255, 0.3);
            font-size: 4rem;
            animation: float 25s infinite linear;
            text-shadow: 0 0 20px currentColor;
        }
        
        /* Day Mode Floating Elements */
        .theme-day .floating-element {
            color: rgba(0, 128, 255, 0.3);
            text-shadow: none;
        }

        .floating-element:nth-child(odd) {
            animation-direction: reverse;
            color: rgba(255, 0, 255, 0.3);
        }

        .theme-day .floating-element:nth-child(odd) {
            color: rgba(255, 102, 0, 0.3);
        }

        .floating-element:nth-child(3n) {
            color: rgba(0, 255, 0, 0.3);
        }

        .theme-day .floating-element:nth-child(3n) {
            color: rgba(0, 136, 0, 0.3);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) rotate(36deg) scale(0.7);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) rotate(324deg) scale(0.7);
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Neon Circuit Lines */
        .circuit-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .circuit-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            height: 2px;
            animation: circuitFlow 8s infinite;
        }

        .circuit-line:nth-child(1) {
            top: 20%;
            width: 100%;
            animation-delay: 0s;
        }

        .circuit-line:nth-child(2) {
            top: 60%;
            width: 100%;
            animation-delay: -2s;
            background: linear-gradient(90deg, transparent, var(--accent-magenta), transparent);
        }

        .circuit-line:nth-child(3) {
            top: 80%;
            width: 100%;
            animation-delay: -4s;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }

        @keyframes circuitFlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* DNA Helix Enhanced */
        .dna-helix {
            position: fixed;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 150px;
            height: 400px;
            z-index: -1;
        }

        .dna-strand {
            position: absolute;
            width: 6px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-magenta));
            border-radius: 3px;
            animation: dnaRotate 12s infinite linear;
            box-shadow: 0 0 20px currentColor;
        }

        .theme-day .dna-strand {
            box-shadow: none;
        }

        .dna-strand:nth-child(1) {
            left: 30px;
            transform-origin: center;
        }

        .dna-strand:nth-child(2) {
            right: 30px;
            animation-delay: -6s;
            background: linear-gradient(180deg, var(--accent-magenta), var(--accent-green));
        }

        @keyframes dnaRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
    /* ===================================
        Hero Section
        ===================================
    */
    .hero {
      text-align: center;
      padding: 150px 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .hero h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
      -webkit-background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }
    
    .theme-day .hero h1 {
      animation: none;
      -webkit-text-fill-color: initial;
      background: none;
    }

    @keyframes titleGlow {
        0% { filter: brightness(1); }
        100% { filter: brightness(1.3); text-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
    }

    .hero p {
      font-size: 1.4rem;
      max-width: 600px;
      margin: 0 auto;
      margin-bottom: 3rem;
      animation: fadeInUp 1s ease-out 0.5s both;
    }
    
    .cta-buttons {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
        animation: fadeInUp 1s ease-out 1s both;
    }

    /* ===================================
        Services/Programs Section
        ===================================
    */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 50px;
    }

    .service-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.5s ease, border 0.5s ease;
      border: 1px solid var(--card-border-cyan);
    }

    .service-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 255, 255, 0.2);
    }
    
    .theme-day .service-card:hover {
      box-shadow: 0 20px 40px rgba(0, 128, 255, 0.2);
    }

    .service-card h3 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .theme-day .service-card h3 {
      background: none;
      -webkit-text-fill-color: initial;
      color: var(--text-primary);
    }

    .service-card p {
      margin-bottom: 25px;
    }
    .service-card ul {
        text-align: left;
    }

    /* ===================================
        About/Features Section
        ===================================
    */
    .section-title {
        text-align: center;
        font-size: 3rem;
        margin-bottom: 20px;
        background: -webkit-linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: titleGlow 3s ease-in-out infinite alternate;
    }
    
    .theme-day .section-title {
        animation: none;
        -webkit-text-fill-color: initial;
        background: none;
    }

    .features p {
        text-align: center;
        max-width: 700px;
        margin: 0 auto;
        font-size: 1.1rem;
    }
    
    /* ===================================
        New Section for Index Page
        ===================================
    */
    .new-features {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 4rem 0;
      margin: 2rem 0;
      border-radius: 20px;
      border: 1px solid var(--card-border-green);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .feature-item {
        text-align: center;
        padding: 2rem;
        background: rgba(0, 255, 0, 0.1);
        border-radius: 15px;
        border: 1px solid var(--card-border-green);
        transition: all 0.3s ease;
    }
    
    .theme-day .feature-item {
        background: rgba(0, 136, 0, 0.1);
    }

    .feature-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0, 255, 0, 0.2);
        background: rgba(0, 255, 0, 0.2);
    }
    
    .theme-day .feature-item:hover {
        box-shadow: 0 20px 40px rgba(0, 136, 0, 0.2);
        background: rgba(0, 136, 0, 0.2);
    }

    .feature-icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
        color: var(--accent-green);
        animation: pulse 2s infinite;
    }

    /* ===================================
        Footer
        ===================================
    */
    footer {
      background: var(--footer-bg);
      backdrop-filter: blur(10px);
      padding: 40px 0;
      text-align: center;
      border-top: 2px solid var(--accent-cyan);
      transition: background-color 0.5s ease, border-top 0.5s ease;
    }

    footer h3 {
        font-size: 1.5rem;
        margin-bottom: 15px;
        color: var(--text-primary);
    }

    footer p {
        margin-bottom: 10px;
        opacity: 0.7;
    }

    .footer-bottom {
        margin-top: 30px;
        border-top: 1px solid var(--card-border-cyan);
        padding-top: 20px;
    }

    /* ===================================
        Language-specific visibility
        ===================================
    */
    .hindi, .marathi { display: none; }
    body.lang-hindi .english, body.lang-hindi .marathi { display: none; }
    body.lang-hindi .hindi { display: inline; }

    body.lang-marathi .english, body.lang-marathi .hindi { display: none; }
    body.lang-marathi .marathi { display: inline; }

    body.lang-hindi .hindi-block { display: block; }
    body.lang-marathi .marathi-block { display: block; }
    .hindi-block, .marathi-block { display: none; }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 0.9;
            transform: translateY(0);
        }
    }
    
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
  </style>
</head>
